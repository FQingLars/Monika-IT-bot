[project]
name = "monikanews"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0",
    "httpx>=0.27",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
monikanews = "monikanews.main:main"
